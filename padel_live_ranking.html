<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!--
  2026-11-10 내렸다(대표 결정 25 · 검토 S4-01) — 구글 시트 시절 공개 순위 페이지.
  예전엔 시트 CSV 를 무료 CORS 프록시로 받아 화면에 그렸고, 이 페이지는 PS Control·코트 태블릿과 같은 출처(padelociety.github.io)라
  프록시가 오염되면 그 기기의 운영자 토큰을 빼 갈 길이었다. 이제 스크립트가 하나도 없는 안내 한 장이다.
  ⚠️ 스크립트·외부 데이터를 다시 넣지 말 것 — 순위는 Playus 앱(리그 상세 '순위' 탭)이 서버 값으로 그린다.
  테스트: tests/xss_escape.test.cjs ⑧.
-->
<title>PS 리그 순위 — 앱으로 옮겼어요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&display=swap">
<style>
  :root { --bg: #F3F5F6; --card: #FFFFFF; --ink: #0E3F55; --soft: #4C6878; --line: #D9E1E6; --accent: #2E9E8F; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0E1A20; --card: #15252D; --ink: #E4EEF2; --soft: #9FB4BF; --line: #2A3E48; --accent: #45B8A8; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans KR', system-ui, -apple-system, sans-serif; line-height: 1.6; }
  main { max-width: 420px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { margin: 0 0 10px; color: var(--soft); font-size: 15px; }
  strong { color: var(--ink); }
  a { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>이 순위 페이지는 내렸어요</h1>
  <p>PS 리그 순위는 이제 <strong>Playus 앱</strong>에서 봐요 — 리그 상세의 <strong>순위</strong> 탭이에요.</p>
  <p>앱이 없으면 <a href="https://padelsociety.co.kr">padelsociety.co.kr</a>에서 받을 수 있어요.</p>
</main>
</body>
</html>
