# Dependabot — 대표 결정 #19 '자동 점검 켜기 — 보안 업데이트만' · 검토 S7-08 (2026-11-09).
#
# 방송 PC 서버(stream_server.py)의 파이썬 의존성(requirements.txt) — 이 서버는 터널로 인터넷에 열려 있다.
# · 보안 업데이트만: 일반 버전 업데이트는 끈다(open-pull-requests-limit: 0 — GitHub 문서의 '보안 업데이트만' 방법).
#   보안 PR 은 GitHub 이 취약점 경보를 낼 때 열리고 **PR 하나로 묶는다**(groups · applies-to: security-updates).
# · 주 1회: schedule 은 버전 업데이트의 주기다(월 09:00 KST). 일반 업데이트도 받고 싶으면 limit 을 0 → 3 으로.
# ⚠️ 이 파일만으로는 보안 PR 이 열리지 않는다 — 저장소 Settings › Code security 에서 'Dependency graph' · 'Dependabot alerts' ·
#    'Dependabot security updates' 를 켠다. 이 파일은 **기본 브랜치(main)** 에 있어야 읽힌다.
# ⚠️ requirements.txt 는 '>=' 범위라(잠금 없음) 경보가 덜 정확할 수 있다 — 잠금(pip-compile --generate-hashes)은 다음 일(검토 S7-08 (4)).
# ⚠️ 보안 PR 을 머지해도 방송 PC 는 저절로 안 바뀐다 — 방송이 없을 때 OBS PC 에서 git pull → pip install -r requirements.txt →
#    stream_server 재시작(방송 중 금지 · README 'OBS PC 에 새 버전 올리기').
# 모노repo(padelociety/playus)의 ps-rank/ 사본은 PR 을 열지 않는다(그쪽 dependabot.yml) — 고친 뒤 그리로 되복사한다.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    open-pull-requests-limit: 0
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: '보안(pip)'
